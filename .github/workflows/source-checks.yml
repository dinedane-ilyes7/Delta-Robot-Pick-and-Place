name: Delta CAD source checks

on:
  push:
    paths:
      - 'analysis/**'
      - 'cad/**/*.py'
      - 'config/**'
      - 'tests/**'
      - 'requirements-cad.txt'
      - '.github/workflows/source-checks.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'cad/**/*.py'
      - 'config/**'
      - 'tests/**'
      - 'requirements-cad.txt'
      - '.github/workflows/source-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kinematics dependencies
        run: python -m pip install "numpy>=1.24,<3" "PyYAML>=6"
      - name: Compile Python source
        run: python -m compileall -q analysis cad tests
      - name: Test inverse/forward kinematics
        run: python -m unittest discover -s tests -v
